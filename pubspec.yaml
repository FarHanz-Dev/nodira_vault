name: nodira_vault
description: >-
  Pure-Dart client-side encryption: passphrase-encrypted backup files
  (AES-256-GCM + PBKDF2) and a zero-knowledge vault key hierarchy
  (Argon2id + HKDF, one key per object) for any dumb storage backend.
version: 0.1.0
repository: https://github.com/FarHanz-Dev/nodira_vault
issue_tracker: https://github.com/FarHanz-Dev/nodira_vault/issues

environment:
  sdk: ^3.6.0

dependencies:
  pointycastle: ^3.9.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
